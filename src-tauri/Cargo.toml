[package]
name = "mesa-de-possibilidades"
version = "0.1.0"
description = "Árvore de possibilidades — investigação combinatória nos anos iniciais"
authors = ["Árvore de possibilidades"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mesa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
